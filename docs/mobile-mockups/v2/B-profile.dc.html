<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Профиль</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="margin: 8px 12px 0; height: 52px; border-radius: 26px; border: 1px solid {{t.border}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: space-between; padding: 0 4px 0 18px; box-sizing: border-box">
<a href="#" style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.16em; color: {{t.fg}}; text-decoration: none">GOO</a>
<div style="display: flex; align-items: center">
<button aria-label="Open AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">AI</button>
<button aria-label="Open bag, 2 items" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="position: absolute; top: 8px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.fg}}; color: {{t.bg}}; font-size: 9px; font-weight: 700; line-height: 15px; text-align: center">2</span>
</button>
</div>
</header>

<div style="margin: 12px 12px 0; padding: 16px; border-radius: 18px; background: {{t.surface}}; display: flex; align-items: center; gap: 14px">
<span style="width: 52px; height: 52px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; font-size: 20px; font-weight: 500">D</span>
<div style="flex: 1; min-width: 0">
<h1 style="margin: 0; font-size: 18px; font-weight: 600">Dara Admin</h1>
<div style="margin-top: 2px; font-size: 13px; color: {{t.muted}}">admin@example.com</div>
</div>
<span style="height: 26px; padding: 0 10px; border-radius: 13px; background: {{t.fg}}; color: {{t.bg}}; display: flex; align-items: center; font-size: 12px; font-weight: 600">Pro</span>
</div>

<div role="tablist" style="margin: 12px 12px 0; height: 44px; box-sizing: border-box; padding: 3px; border-radius: 22px; background: {{t.surface}}; display: grid; grid-template-columns: repeat(3, minmax(0, 1fr))">
<sc-for list="{{tabs}}" as="b" hint-placeholder-count="3">
<button role="tab" aria-selected="{{b.on}}" style="border: 0; border-radius: 19px; background: {{b.bg}}; color: {{b.color}}; font-family: inherit; font-size: 14px; font-weight: {{b.fw}}; cursor: pointer">{{b.label}}</button>
</sc-for>
</div>

<div style="margin: 16px 12px 0; border-radius: 18px; background: {{t.surface}}; overflow: hidden">
<a href="#" style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; text-decoration: none; color: {{t.fg}}">
<span style="flex: 1; font-size: 15px">Plan</span><span style="font-size: 15px; color: {{t.muted}}">Pro · renews Nov 6</span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
<div style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 10px 0 16px; box-shadow: inset 0 1px 0 {{t.border}}">
<span style="flex: 1; font-size: 15px">Appearance</span>
<div role="radiogroup" aria-label="Theme" style="display: flex; padding: 3px; border-radius: 12px; background: {{t.soft}}">
<button role="radio" aria-checked="false" style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 13px; cursor: pointer">Light</button>
<button role="radio" aria-checked="true" style="height: 34px; padding: 0 14px; border: 0; border-radius: 9px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">Dark</button>
</div>
</div>
<a href="#" style="height: 56px; display: flex; align-items: center; gap: 10px; padding: 0 16px; box-shadow: inset 0 1px 0 {{t.border}}; text-decoration: none; color: {{t.fg}}">
<span style="flex: 1; font-size: 15px">Currency</span><span style="font-size: 15px; color: {{t.muted}}">US dollar, $</span>
<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

<div style="margin: 12px 12px 0; border-radius: 18px; background: {{t.surface}}; overflow: hidden">
<button style="width: 100%; height: 56px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; gap: 10px; padding: 0 16px; font-family: inherit; font-size: 15px; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M14 4h5v16h-5M10 16l4-4-4-4M14 12H4"></path></svg>
Sign out
</button>
</div>

<nav aria-label="Main" style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 56px; padding: 0 6px; box-sizing: border-box; border-radius: 28px; background: {{t.overlay}}; border: 1px solid {{t.border}}; display: flex; align-items: center; justify-content: space-between; backdrop-filter: blur(14px)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" aria-label="{{n.label}}" style="height: 44px; min-width: 44px; padding: {{n.pad}}; box-sizing: border-box; border-radius: 22px; background: {{n.bg}}; display: flex; align-items: center; justify-content: center; gap: 7px; text-decoration: none; color: {{n.color}}">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<sc-if value="{{n.active}}" hint-placeholder-val="{{false}}"><span style="font-size: 12px; font-weight: 600">{{n.label}}</span></sc-if>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', overlay: 'rgba(22,22,21,0.92)', soft: 'rgba(240,238,232,0.09)' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', overlay: 'rgba(255,255,255,0.92)', soft: 'rgba(10,10,10,0.06)' };
const tabs = ['Account', 'Plan', 'AI stylist'].map((label) => {
const on = label === 'Account';
return { label, on, bg: on ? t.fg : 'transparent', color: on ? t.bg : t.muted, fw: on ? 600 : 500 };
});
const icons = [
['Browse', 'M17.5 11a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0 M16 16l4 4'],
['Builder', 'M7 4L3 8v2.5L5.5 9V20h13V9l2.5 1.5V8l-4-4S15.5 6 12 6 7 4 7 4Z'],
['Journal', 'M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5v-14Z M5 19.5A2.5 2.5 0 0 1 7.5 17H19v4H7.5A2.5 2.5 0 0 1 5 19.5Z M9 7.5h6M9 10.5h4'],
['My likes', 'M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z'],
['Profile', 'M16 8a4 4 0 1 1-8 0a4 4 0 1 1 8 0 M4.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5']
];
const nav = icons.map(([label, d]) => {
const on = label === 'Profile';
return { label, d, active: on, color: on ? t.fg : t.muted, sw: on ? 1.7 : 1.3, bg: on ? t.soft : 'transparent', pad: on ? '0 14px 0 12px' : '0' };
});
return { t, tabs, nav };
}
}
</script>
</body>
</html>
