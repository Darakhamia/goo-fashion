<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · AI-стилист</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<section role="dialog" aria-modal="true" aria-label="AI Stylist" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: {{t.sheet}}; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.strong}}; margin: 8px auto 0"></div>
<div style="display: flex; align-items: center; gap: 10px; padding: 6px 6px 6px 16px">
<span style="width: 36px; height: 36px; border-radius: 50%; background: {{t.fg}}; color: {{t.sheet}}; display: flex; align-items: center; justify-content: center; font-size: 14px; font-weight: 700">G</span>
<div style="flex: 1"><div style="font-size: 16px; font-weight: 600">Stylist</div><div style="display: flex; align-items: center; gap: 5px; font-size: 12px; color: {{t.muted}}"><span style="width: 6px; height: 6px; border-radius: 50%; background: #3E9A63"></span>Online</div></div>
<button aria-label="New chat" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 5H6a1 1 0 0 0-1 1v12a1 1 0 0 0 1 1h12a1 1 0 0 0 1-1v-6M16.5 4.5l3 3L12 15l-4 1 1-4 7.5-7.5Z"></path></svg></button>
<button aria-label="History" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8"></circle><path d="M12 8v4l3 2"></path></svg></button>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>

<div style="flex: 1; padding: 12px 16px 0; display: flex; flex-direction: column; gap: 10px">
<div style="max-width: 280px; border-radius: 18px 18px 18px 6px; background: {{t.soft}}; padding: 11px 14px; font-size: 15px; line-height: 1.4">Hi! I'm your AI Stylist. Tell me what vibe you're going for, or pick a prompt below.</div>
<div style="align-self: flex-end; max-width: 260px; border-radius: 18px 18px 6px 18px; background: {{t.fg}}; color: {{t.sheet}}; padding: 11px 14px; font-size: 15px; line-height: 1.4">Something minimal for the office</div>
<div style="max-width: 300px; border-radius: 18px 18px 18px 6px; background: {{t.soft}}; padding: 11px 14px; font-size: 15px; line-height: 1.4">Here's a calm, tailored look built around a navy blazer.</div>
<a href="#" style="max-width: 300px; height: 72px; border-radius: 16px; background: {{t.soft}}; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; text-decoration: none; color: {{t.fg}}">
<span style="width: 56px; height: 56px; border-radius: 12px; background: {{t.photo}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 120 160" style="width: 32px; height: auto"><path d="M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z" fill="#3E4A57"></path></svg></span>
<span style="flex: 1"><span style="display: block; font-size: 14px; font-weight: 600">The Considered Minimal</span><span style="display: block; margin-top: 2px; font-size: 12px; color: {{t.muted}}">$2,060–$2,390 · 3 pieces</span></span>
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</a>
</div>

<div style="padding: 0 0 10px 16px; display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{prompts}}" as="p" hint-placeholder-count="4">
<button style="height: 36px; flex: none; padding: 0 14px; border: 0; border-radius: 18px; background: {{t.soft}}; color: {{t.fg}}; font-family: inherit; font-size: 13px; cursor: pointer">{{p}}</button>
</sc-for>
</div>
<div style="padding: 0 16px 30px">
<label style="height: 50px; border-radius: 25px; background: {{t.soft}}; display: flex; align-items: center; padding: 0 6px 0 18px">
<input aria-label="Ask your stylist" placeholder="Ask your stylist…" style="flex: 1; min-width: 0; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 16px; outline: none">
<button aria-label="Send" style="width: 38px; height: 38px; border: 0; border-radius: 50%; background: {{t.strong}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.sheet}}" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M6 11l6-6 6 6"></path></svg></button>
</label>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', sheet: '#151515', fg: '#F0EEE8', muted: '#8E8E89', strong: '#3A3A38', soft: 'rgba(240,238,232,0.08)', scrim: 'rgba(0,0,0,0.6)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', sheet: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', strong: '#C0BEB8', soft: 'rgba(10,10,10,0.05)', scrim: 'rgba(0,0,0,0.35)', photo: '#EFEDE8' };
return { t, dark, no: false, two: 2, prompts: ['Minimal looks', "What's trending?", 'Under $500', 'Complete a look'] };
}
}
</script>
</body>
</html>
