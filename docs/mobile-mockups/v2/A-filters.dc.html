<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>А · Фильтры и сортировка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<div style="height: 52px; display: flex; align-items: center; padding: 0 20px; font-family: Poppins, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.16em">GOO</div>
<div style="padding: 4px 20px 0; font-size: 32px; font-weight: 600; letter-spacing: -0.02em">Browse</div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<section role="dialog" aria-modal="true" aria-label="Sort and filter" style="position: absolute; left: 0; right: 0; top: 64px; bottom: 0; background: {{t.bg}}; border-radius: 16px 16px 0 0; border-top: 1px solid {{t.border}}; display: flex; flex-direction: column">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.strong}}; margin: 8px auto 0"></div>
<div style="display: flex; align-items: center; justify-content: space-between; padding: 4px 8px 4px 20px">
<h2 style="margin: 0; font-size: 17px; font-weight: 600">Sort &amp; filter</h2>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg>
</button>
</div>

<div style="flex: 1; padding: 0 20px">
<sc-for list="{{rows}}" as="r" hint-placeholder-count="7">
<button style="width: 100%; height: 56px; border: 0; border-bottom: 1px solid {{t.border}}; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: space-between; padding: 0; font-family: inherit; cursor: pointer">
<span style="font-size: 15px">{{r.label}}</span>
<span style="display: flex; align-items: center; gap: 6px; font-size: 14px; color: {{r.valueColor}}">{{r.value}}
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
</span>
</button>
</sc-for>
<label style="height: 56px; display: flex; align-items: center; justify-content: space-between; font-size: 15px">
Only my likes
<span style="width: 44px; height: 26px; border-radius: 13px; background: {{t.track}}; position: relative; display: block">
<span style="position: absolute; top: 3px; left: 3px; width: 20px; height: 20px; border-radius: 50%; background: {{t.knob}}"></span>
</span>
</label>
</div>

<div style="border-top: 1px solid {{t.border}}; padding: 12px 20px 32px; display: flex; align-items: center; gap: 12px">
<button style="height: 48px; padding: 0 8px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 15px; text-decoration: underline; text-underline-offset: 4px; cursor: pointer">Clear all</button>
<button style="flex: 1; height: 48px; border: 0; border-radius: 12px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Show 18 pieces</button>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89', border: '#222220', strong: '#3A3A38', scrim: 'rgba(0,0,0,0.6)', track: '#2A2A28', knob: '#8E8E89' }
: { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E4E1DA', strong: '#C0BEB8', scrim: 'rgba(0,0,0,0.35)', track: '#DAD7D0', knob: '#FFFFFF' };
const rows = [
['Sort', 'Featured', false], ['Category', 'Outerwear, Knitwear', true], ['Style', 'Any', false], ['Gender', 'Women', true],
['Colour', 'Any', false], ['Designer', 'Any', false], ['Price', 'Any', false]
].map(([label, value, set]) => ({ label, value, valueColor: set ? t.fg : t.muted }));
return { t, rows };
}
}
</script>
</body>
</html>
