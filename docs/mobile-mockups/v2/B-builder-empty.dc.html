<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Конструктор — пусто</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="height: 60px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; box-sizing: border-box">
<button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<h1 style="flex: 1; margin: 0 0 0 4px; font-size: 17px; font-weight: 600">New look</h1>
<button style="height: 44px; padding: 0 16px; border-radius: 22px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">AI</button>
<button disabled style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: {{t.soft}}; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 600">Save</button>
</header>

<div style="margin: 12px 12px 0; height: 330px; border-radius: 20px; background: {{t.surface}}; box-shadow: inset 0 0 0 1px {{t.border}}; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 0 40px">
<span style="width: 56px; height: 56px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"><rect x="4" y="4" width="7" height="7" rx="1.5"></rect><rect x="13" y="4" width="7" height="7" rx="1.5"></rect><rect x="4" y="13" width="7" height="7" rx="1.5"></rect><rect x="13" y="13" width="7" height="7" rx="1.5"></rect></svg></span>
<div style="margin-top: 14px; font-size: 16px; font-weight: 600">Add pieces to build your look</div>
<div style="margin-top: 4px; font-size: 14px; color: {{t.muted}}">Tap any piece below, or ask the AI stylist to start one for you.</div>
</div>

<div style="margin-top: 14px; padding: 0 12px; display: flex; gap: 6px; overflow: hidden">
<button aria-label="Filters" style="width: 40px; height: 40px; flex: none; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg></button>
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button aria-pressed="{{c.on}}" style="height: 40px; flex: none; padding: 0 15px; border: 0; border-radius: 20px; background: {{c.bg}}; color: {{c.color}}; font-family: inherit; font-size: 13px; font-weight: {{c.fw}}; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>

<div style="padding: 12px 0 0 12px; display: flex; gap: 8px; overflow: hidden">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<button aria-label="Add {{p.brand}}" style="width: 124px; flex: none; border: 0; padding: 0 0 10px; border-radius: 14px; overflow: hidden; background: {{t.surface}}; color: {{t.fg}}; text-align: left; font-family: inherit; cursor: pointer">
<span style="position: relative; display: flex; align-items: center; justify-content: center; height: 140px; background: {{t.photo}}">
<svg viewBox="0 0 120 160" style="width: 62px; height: auto"><path d="{{p.d}}" fill="{{p.c}}"></path></svg>
<span style="position: absolute; right: 8px; bottom: 8px; width: 26px; height: 26px; border-radius: 50%; background: rgba(255,255,255,0.9); display: flex; align-items: center; justify-content: center"><svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="2.2" stroke-linecap="round"><path d="M12 6v12M6 12h12"></path></svg></span>
</span>
<span style="display: block; padding: 8px 10px 0; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.brand}}</span>
<span style="display: block; padding: 0 10px; font-size: 12px; color: {{t.muted}}">{{p.price}}</span>
</button>
</sc-for>
</div>

<div style="position: absolute; left: 12px; bottom: 20px; width: 366px; height: 56px"><dc-import name="B-part-nav" dark="{{dark}}" active="Builder" hint-size="366px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', soft: 'rgba(240,238,232,0.09)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', soft: 'rgba(10,10,10,0.06)', photo: '#EFEDE8' };
const cats = ['All', 'Tops', 'Bottoms', 'Shoes', 'Accessories'].map((label) => {
const on = label === 'All';
return { label, on, bg: on ? t.fg : t.soft, color: on ? t.bg : t.fg, fw: on ? 600 : 400 };
});
const items = [
{ brand: 'Acne Studios', price: '$540', c: '#2B2926', d: 'M28 56 L52 56 L52 116 Q66 118 74 126 Q78 138 72 142 L24 142 L24 118 Z M64 46 L88 46 L88 106 Q102 108 110 116 Q114 128 108 132 L60 132 L60 108 Z' },
{ brand: 'Massimo Dutti', price: '$139', c: '#5A5550', d: 'M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z' },
{ brand: 'Cos', price: '$95', c: '#F4F1EA', d: 'M47 20 L60 30 L73 20 L95 30 L106 92 L95 96 L88 60 L88 134 L32 134 L32 60 L25 96 L14 92 L25 30 Z' },
{ brand: 'Toteme', price: '$890', c: '#B39373', d: 'M44 16 L60 28 L76 16 L95 27 L106 98 L94 101 L86 60 L88 150 L32 150 L34 60 L26 101 L14 98 L25 27 Z' }
];
return { t, dark, cats, items };
}
}
</script>
</body>
</html>
