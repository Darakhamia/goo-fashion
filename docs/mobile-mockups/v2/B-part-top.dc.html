<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Деталь · шапка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<header style="width: 366px; height: 52px; box-sizing: border-box; border-radius: 26px; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; display: flex; align-items: center; padding: {{pad}}">
<sc-if value="{{back}}" hint-placeholder-val="{{false}}">
<button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
</sc-if>
<a href="#" style="flex: 1; text-align: {{logoAlign}}; font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.16em; color: {{t.fg}}; text-decoration: none">GOO</a>
<button aria-label="Open AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">AI</button>
<button aria-label="Open bag" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<sc-if value="{{hasCount}}" hint-placeholder-val="{{true}}">
<span style="position: absolute; top: 8px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.fg}}; color: {{t.surface}}; font-size: 9px; font-weight: 700; line-height: 15px; text-align: center">{{count}}</span>
</sc-if>
</button>
</header>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"back":{"editor":"boolean","default":false},"count":{"editor":"int","default":2,"min":0,"max":9},"$preview":{"width":366,"height":52}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const back = this.props.back ?? false;
const count = this.props.count ?? 2;
const t = dark
? { surface: '#151515', fg: '#F0EEE8', border: '#232321' }
: { surface: '#FFFFFF', fg: '#0A0A0A', border: '#E8E6E0' };
return { t, back, count, hasCount: count > 0, pad: back ? '0 4px' : '0 4px 0 18px', logoAlign: back ? 'center' : 'left' };
}
}
</script>
</body>
</html>
