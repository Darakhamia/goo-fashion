<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Оформление подписки</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{yes}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>

<div style="padding: 80px 16px 0">
<div style="font-size: 13px; color: {{t.muted}}">Subscribe</div>
<h1 style="margin: 4px 0 0; font-size: 28px; font-weight: 600; letter-spacing: -0.02em">Pro plan</h1>
</div>

<div style="margin: 16px 12px 0; border-radius: 20px; background: {{t.surface}}; padding: 18px">
<div style="display: flex; align-items: baseline; justify-content: space-between"><span style="font-size: 16px; font-weight: 600">Pro</span><span><span style="font-size: 24px; font-weight: 700">$25</span><span style="font-size: 14px; color: {{t.muted}}"> / month</span></span></div>
<div style="margin-top: 4px; font-size: 13px; color: {{t.muted}}">charged as 999 ₴ / month via monobank</div>
<div style="margin-top: 16px; padding-top: 14px; box-shadow: inset 0 1px 0 {{t.border}}; display: flex; flex-direction: column; gap: 9px">
<sc-for list="{{features}}" as="f" hint-placeholder-count="6">
<div style="display: flex; align-items: center; gap: 10px; font-size: 14px"><svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="{{t.fg}}" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg>{{f}}</div>
</sc-for>
</div>
</div>
<p style="margin: 14px 16px 0; font-size: 13px; line-height: 1.5; color: {{t.muted}}">You'll be redirected to monobank's payment page. Your subscription renews automatically each month — cancel anytime from your profile.</p>

<div style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 64px; border-radius: 22px; background: {{t.overlay}}; border: 1px solid {{t.border}}; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; box-sizing: border-box; backdrop-filter: blur(14px)">
<div style="flex: 1"><div style="font-size: 15px; font-weight: 600">999 ₴ / month</div><div style="font-size: 12px; color: {{t.muted}}">≈ $25 · cancel anytime</div></div>
<button style="height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Continue to payment</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', overlay: 'rgba(22,22,21,0.92)' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', overlay: 'rgba(255,255,255,0.92)' };
const features = ['180 image generations / mo', '~1,000 AI messages / mo', 'Priority generation', 'Better AI stylist', 'Save outfits', 'Higher image quality'];
return { t, dark, yes: true, two: 2, features };
}
}
</script>
</body>
</html>
