<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · 404</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>

<div style="position: absolute; left: 28px; right: 28px; top: 230px; text-align: center">
<div style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 64px; letter-spacing: 0.08em; color: {{t.faint}}">404</div>
<h1 style="margin: 12px 0 0; font-size: 22px; font-weight: 600">This page doesn't exist</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">The look you're searching for may have been moved or removed. Let's get you back to something stylish.</p>
<a href="#" style="margin: 24px auto 0; width: fit-content; height: 48px; padding: 0 24px; border-radius: 24px; background: {{t.fg}}; color: {{t.bg}}; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Back to home</a>
<a href="#" style="margin: 6px auto 0; width: fit-content; height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; color: {{t.fg}}; text-decoration: none">Browse fashion</a>
</div>

<div style="position: absolute; left: 12px; bottom: 20px; width: 366px; height: 56px"><dc-import name="B-part-nav" dark="{{dark}}" active="none" hint-size="366px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark ? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89', faint: '#3A3A38' } : { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B', faint: '#C0BEB8' };
return { t, dark, no: false, two: 2 };
}
}
</script>
</body>
</html>
