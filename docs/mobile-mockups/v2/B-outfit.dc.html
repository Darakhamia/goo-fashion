<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Образ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="margin: 8px 12px 0; height: 52px; border-radius: 26px; border: 1px solid {{t.border}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-sizing: border-box">
<button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<a href="#" style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.16em; color: {{t.fg}}; text-decoration: none">GOO</a>
<div style="display: flex; align-items: center">
<button aria-label="Open AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">AI</button>
<button aria-label="Open bag, 2 items" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="position: absolute; top: 8px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.fg}}; color: {{t.bg}}; font-size: 9px; font-weight: 700; line-height: 15px; text-align: center">2</span>
</button>
</div>
</header>

<div style="margin: 12px 12px 0; position: relative; height: 360px; border-radius: 20px; overflow: hidden; background: {{t.photo}}">
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 18px; top: 30px; width: 180px; height: auto"><path d="M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z" fill="#3E4A57"></path><path d="M60 30 L60 132 M44 20 L53 60 L60 30 M76 20 L67 60 L60 30" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1" stroke-linecap="round"></path></svg>
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 210px; top: 22px; width: 120px; height: auto"><path d="M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z" fill="#8C877C"></path><path d="M36 24 L84 24 M60 24 L60 56" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" stroke-linecap="round"></path></svg>
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 222px; top: 198px; width: 112px; height: auto"><path d="M28 56 L52 56 L52 116 Q66 118 74 126 Q78 138 72 142 L24 142 L24 118 Z M64 46 L88 46 L88 106 Q102 108 110 116 Q114 128 108 132 L60 132 L60 108 Z" fill="#2B2926"></path></svg>
<button aria-label="Like outfit" style="position: absolute; top: 4px; right: 4px; width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.78); display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"></path></svg>
</span>
</button>
</div>

<div style="padding: 16px 16px 0">
<h1 style="margin: 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Jil Sander + Lemaire minimal look</h1>
<div style="margin-top: 10px; display: flex; gap: 6px">
<sc-for list="{{tags}}" as="g" hint-placeholder-count="4">
<span style="height: 28px; padding: 0 11px; border-radius: 14px; background: {{t.soft}}; display: flex; align-items: center; font-size: 12px; color: {{t.fg}}">{{g}}</span>
</sc-for>
</div>
<div style="margin-top: 16px; display: flex; flex-direction: column; gap: 8px">
<sc-for list="{{pieces}}" as="p" hint-placeholder-count="2">
<a href="#" style="height: 64px; border-radius: 14px; background: {{t.surface}}; display: flex; align-items: center; gap: 12px; padding: 0 12px 0 8px; text-decoration: none; color: {{t.fg}}">
<span style="width: 48px; height: 48px; border-radius: 10px; background: {{t.photo}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 120 160" style="width: 30px; height: auto"><path d="{{p.d}}" fill="{{p.c}}"></path></svg></span>
<span style="flex: 1; min-width: 0"><span style="display: block; font-size: 12px; color: {{t.muted}}">{{p.brand}}</span><span style="display: block; font-size: 14px; font-weight: 500">{{p.name}}</span></span>
<span style="font-size: 14px; font-weight: 600">{{p.price}}</span>
</a>
</sc-for>
</div>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 64px; border-radius: 22px; background: {{t.overlay}}; border: 1px solid {{t.border}}; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; box-sizing: border-box; backdrop-filter: blur(14px)">
<div style="flex: 1">
<div style="font-size: 15px; font-weight: 600">$2,060–$2,390</div>
<div style="font-size: 12px; color: {{t.muted}}">3 pieces</div>
</div>
<button aria-label="Share" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: {{t.soft}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 15V4M8 8l4-4 4 4M5 13v6h14v-6"></path></svg>
</button>
<button style="height: 44px; padding: 0 18px; border: 0; border-radius: 22px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Add all to bag</button>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', overlay: 'rgba(22,22,21,0.92)', soft: 'rgba(240,238,232,0.09)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', overlay: 'rgba(255,255,255,0.92)', soft: 'rgba(10,10,10,0.06)', photo: '#EFEDE8' };
const tags = ['Work', 'All season', 'Minimal', 'Classic'];
const pieces = [
{ brand: 'Jil Sander', name: 'Structured Blazer', price: 'from $1,100', c: '#3E4A57', d: 'M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z' },
{ brand: 'Lemaire', name: 'Wide-Leg Trousers', price: 'from $420', c: '#8C877C', d: 'M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z' },
{ brand: 'Acne Studios', name: 'Chelsea Boots', price: 'from $540', c: '#2B2926', d: 'M28 56 L52 56 L52 116 Q66 118 74 126 Q78 138 72 142 L24 142 L24 118 Z M64 46 L88 46 L88 106 Q102 108 110 116 Q114 128 108 132 L60 132 L60 108 Z' }
];
return { t, tags, pieces };
}
}
</script>
</body>
</html>
