<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Ошибка</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>

<div role="alert" style="position: absolute; left: 28px; right: 28px; top: 250px; text-align: center">
<span style="margin: 0 auto; width: 64px; height: 64px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M12 8v5M12 16.5v.01"></path><circle cx="12" cy="12" r="8.5"></circle></svg></span>
<h1 style="margin: 18px 0 0; font-size: 22px; font-weight: 600">Something went wrong</h1>
<p style="margin: 8px 0 0; font-size: 15px; line-height: 1.5; color: {{t.muted}}">An unexpected error occurred. It's on us — try again, or head back to the homepage.</p>
<button style="margin-top: 24px; height: 48px; padding: 0 26px; border: 0; border-radius: 24px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Try again</button>
<a href="#" style="margin: 6px auto 0; width: fit-content; height: 44px; padding: 0 16px; display: flex; align-items: center; font-size: 15px; color: {{t.fg}}; text-decoration: none">Back to home</a>
</div>

<div style="position: absolute; left: 12px; bottom: 20px; width: 366px; height: 56px"><dc-import name="B-part-nav" dark="{{dark}}" active="none" hint-size="366px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark ? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89', soft: 'rgba(240,238,232,0.08)' } : { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B', soft: 'rgba(10,10,10,0.05)' };
return { t, dark, no: false, two: 2 };
}
}
</script>
</body>
</html>
