<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Главная — первый экран</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>

<div style="position: absolute; left: 24px; right: 24px; top: 250px; text-align: center">
<div style="font-size: 76px; line-height: 1; font-weight: 700; letter-spacing: -0.045em">Looks</div>
<p style="margin: 18px 0 0; font-size: 17px; color: {{t.muted}}">Build your look</p>
<a href="#" style="margin: 28px auto 0; width: fit-content; height: 52px; padding: 0 22px 0 26px; border-radius: 26px; background: {{t.fg}}; color: {{t.bg}}; display: flex; align-items: center; gap: 10px; font-size: 16px; font-weight: 600; text-decoration: none">
Build your look
<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"></path></svg>
</a>
</div>

<div aria-hidden="true" style="position: absolute; left: 0; right: 0; top: 690px; display: flex; justify-content: center; color: {{t.muted}}">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"></path></svg>
</div>

<div style="position: absolute; left: 12px; bottom: 20px; width: 366px; height: 56px"><dc-import name="B-part-nav" dark="{{dark}}" active="none" hint-size="366px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark ? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89' } : { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B' };
return { t, dark, no: false, two: 2 };
}
}
</script>
</body>
</html>
