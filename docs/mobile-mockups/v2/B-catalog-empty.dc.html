<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Каталог — ничего не найдено</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{two}}" hint-size="366px,52px"></dc-import></div>

<div style="padding: 72px 12px 0; display: flex; align-items: center; gap: 8px">
<div role="group" aria-label="Show" style="flex: 1; height: 44px; box-sizing: border-box; padding: 3px; border-radius: 22px; background: {{t.surface}}; border: 1px solid {{t.border}}; display: grid; grid-template-columns: repeat(2, minmax(0, 1fr))">
<button aria-pressed="true" style="border: 0; border-radius: 19px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">Pieces</button>
<button aria-pressed="false" style="border: 0; border-radius: 19px; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; font-weight: 500; cursor: pointer">Outfits</button>
</div>
<button aria-label="Search" style="width: 44px; height: 44px; flex: none; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></button>
<button aria-label="Sort and filter, 3 active" style="width: 44px; height: 44px; flex: none; position: relative; border-radius: 50%; border: 1px solid {{t.fg}}; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg><span style="position: absolute; top: -2px; right: -2px; width: 17px; height: 17px; border-radius: 50%; background: {{t.fg}}; color: {{t.bg}}; font-size: 10px; font-weight: 700; line-height: 17px; text-align: center">3</span></button>
</div>

<div style="padding: 10px 12px 0; display: flex; gap: 6px">
<sc-for list="{{chips}}" as="c" hint-placeholder-count="3">
<button aria-label="Remove filter {{c}}" style="height: 32px; padding: 0 8px 0 12px; border: 0; border-radius: 16px; background: {{t.soft}}; color: {{t.fg}}; display: flex; align-items: center; gap: 4px; font-family: inherit; font-size: 13px; cursor: pointer">{{c}}<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="{{t.muted}}" stroke-width="2" stroke-linecap="round"><path d="M7 7l10 10M17 7L7 17"></path></svg></button>
</sc-for>
</div>

<div style="margin: 16px 12px 0; padding: 48px 24px; border-radius: 18px; background: {{t.surface}}; text-align: center">
<span style="margin: 0 auto; width: 56px; height: 56px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><circle cx="11" cy="11" r="6.5"></circle><path d="M16 16l4 4"></path></svg></span>
<h2 style="margin: 16px 0 0; font-size: 19px; font-weight: 600">No pieces found</h2>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.45; color: {{t.muted}}">Try adjusting your search or filters.</p>
<button style="margin-top: 20px; height: 44px; padding: 0 20px; border: 0; border-radius: 22px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Clear all filters</button>
</div>

<div style="position: absolute; left: 12px; bottom: 20px; width: 366px; height: 56px"><dc-import name="B-part-nav" dark="{{dark}}" active="Browse" hint-size="366px,56px"></dc-import></div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', soft: 'rgba(240,238,232,0.08)' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', soft: 'rgba(10,10,10,0.05)' };
return { t, dark, no: false, two: 2, chips: ['Dresses', 'Green', 'Under $100'] };
}
}
</script>
</body>
</html>
