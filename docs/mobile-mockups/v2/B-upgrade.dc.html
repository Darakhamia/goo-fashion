<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Окно «нужен тариф»</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="height: 60px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; box-sizing: border-box">
<span style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}"></span>
<span style="flex: 1; margin-left: 4px; font-size: 17px; font-weight: 600">New look</span>
</div>
<div style="margin: 12px 12px 0; height: 330px; border-radius: 20px; background: {{t.photo}}"></div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<section role="dialog" aria-modal="true" aria-labelledby="upgrade-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{t.sheet}}; border-radius: 20px 20px 0 0; padding: 8px 20px 32px; text-align: center">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.strong}}; margin: 0 auto"></div>
<div style="display: flex; justify-content: flex-end; margin-right: -12px"><button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button></div>
<span style="margin: -8px auto 0; width: 60px; height: 60px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; color: {{t.fg}}"><svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><rect x="5" y="11" width="14" height="9" rx="2"></rect><path d="M8 11V8a4 4 0 0 1 8 0v3"></path></svg></span>
<h2 id="upgrade-title" style="margin: 16px 0 0; font-size: 20px; font-weight: 600">Upgrade to continue</h2>
<p style="margin: 8px auto 0; max-width: 300px; font-size: 15px; line-height: 1.5; color: {{t.muted}}">Saved outfits is available on Pro and above. Upgrade to continue.</p>
<a href="#" style="margin-top: 22px; height: 50px; border-radius: 25px; background: {{t.fg}}; color: {{t.sheet}}; display: flex; align-items: center; justify-content: center; font-size: 16px; font-weight: 600; text-decoration: none">See plans</a>
<button style="margin-top: 6px; width: 100%; height: 44px; border: 0; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 15px; cursor: pointer">Not now</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', sheet: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', strong: '#3A3A38', soft: 'rgba(240,238,232,0.08)', scrim: 'rgba(0,0,0,0.6)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', surface: '#FFFFFF', sheet: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', strong: '#C0BEB8', soft: 'rgba(10,10,10,0.05)', scrim: 'rgba(0,0,0,0.35)', photo: '#EFEDE8' };
return { t };
}
}
</script>
</body>
</html>
