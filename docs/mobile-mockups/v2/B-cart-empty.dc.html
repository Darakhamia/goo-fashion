<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Корзина — пусто</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="position: absolute; left: 12px; top: 8px; width: 366px; height: 52px"><dc-import name="B-part-top" dark="{{dark}}" back="{{no}}" count="{{zero}}" hint-size="366px,52px"></dc-import></div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<section role="dialog" aria-modal="true" aria-label="Bag" style="position: absolute; left: 0; right: 0; top: 56px; bottom: 0; background: {{t.sheet}}; border-radius: 20px 20px 0 0; display: flex; flex-direction: column">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.strong}}; margin: 8px auto 0"></div>
<div style="display: flex; align-items: center; padding: 6px 6px 6px 16px">
<h2 style="margin: 0; flex: 1; font-size: 18px; font-weight: 600">Bag</h2>
<button aria-label="Close" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 0 36px 120px; text-align: center">
<span style="width: 64px; height: 64px; border-radius: 50%; background: {{t.soft}}; display: flex; align-items: center; justify-content: center; color: {{t.muted}}"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg></span>
<h3 style="margin: 18px 0 0; font-size: 19px; font-weight: 600">Your bag is empty</h3>
<p style="margin: 6px 0 0; font-size: 14px; line-height: 1.5; color: {{t.muted}}">Build an outfit in the builder and add the look here, or pick pieces one by one.</p>
<a href="#" style="margin-top: 22px; height: 46px; padding: 0 22px; border-radius: 23px; background: {{t.fg}}; color: {{t.sheet}}; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Browse the catalogue</a>
</div>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', sheet: '#151515', fg: '#F0EEE8', muted: '#8E8E89', strong: '#3A3A38', soft: 'rgba(240,238,232,0.08)', scrim: 'rgba(0,0,0,0.6)' }
: { bg: '#F4F2EE', sheet: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', strong: '#C0BEB8', soft: 'rgba(10,10,10,0.05)', scrim: 'rgba(0,0,0,0.35)' };
return { t, dark, no: false, zero: 0 };
}
}
</script>
</body>
</html>
