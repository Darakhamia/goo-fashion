<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Конструктор — сохранить образ</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="height: 60px; display: flex; align-items: center; gap: 8px; padding: 8px 12px 0; box-sizing: border-box">
<span style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}"></span>
<span style="flex: 1; margin-left: 4px; font-size: 17px; font-weight: 600">New look</span>
</div>
<div style="margin: 12px 12px 0; position: relative; height: 330px; border-radius: 20px; background: {{t.photo}}">
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 22px; top: 22px; width: 165px; height: auto"><path d="M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z" fill="#3E4A57"></path></svg>
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 204px; top: 16px; width: 112px; height: auto"><path d="M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z" fill="#8C877C"></path></svg>
<svg viewBox="0 0 120 160" aria-hidden="true" style="position: absolute; left: 214px; top: 170px; width: 104px; height: auto"><path d="M28 56 L52 56 L52 116 Q66 118 74 126 Q78 138 72 142 L24 142 L24 118 Z M64 46 L88 46 L88 106 Q102 108 110 116 Q114 128 108 132 L60 132 L60 108 Z" fill="#2B2926"></path></svg>
</div>
<div style="position: absolute; inset: 0; background: {{t.scrim}}"></div>

<section role="dialog" aria-modal="true" aria-labelledby="save-title" style="position: absolute; left: 0; right: 0; bottom: 0; background: {{t.sheet}}; border-radius: 20px 20px 0 0; padding: 8px 16px 30px">
<div style="width: 36px; height: 4px; border-radius: 2px; background: {{t.strong}}; margin: 0 auto"></div>
<div style="display: flex; align-items: center; margin-top: 4px">
<h2 id="save-title" style="flex: 1; margin: 0; font-size: 18px; font-weight: 600">Save look</h2>
<button aria-label="Close" style="width: 44px; height: 44px; margin-right: -10px; border: 0; background: transparent; color: {{t.muted}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"></path></svg></button>
</div>
<div style="margin-top: 6px; display: flex; align-items: center; gap: 12px">
<span style="width: 64px; height: 64px; border-radius: 12px; background: {{t.photo}}; display: flex; align-items: center; justify-content: center"><svg viewBox="0 0 120 160" style="width: 34px; height: auto"><path d="M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z" fill="#3E4A57"></path></svg></span>
<div><div style="font-size: 15px; font-weight: 500">3 pieces</div><div style="margin-top: 2px; font-size: 13px; color: {{t.muted}}">$2,060 in total</div></div>
</div>
<label style="display: block; margin-top: 18px; font-size: 13px; color: {{t.muted}}">Name
<input value="Office minimal" placeholder="Name your look…" style="display: block; margin-top: 8px; width: 100%; box-sizing: border-box; height: 50px; border: 1px solid {{t.strong}}; border-radius: 14px; background: transparent; color: {{t.fg}}; padding: 0 14px; font-family: inherit; font-size: 16px; outline: none">
</label>
<button style="margin-top: 18px; width: 100%; height: 50px; border: 0; border-radius: 25px; background: {{t.fg}}; color: {{t.sheet}}; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Save look</button>
</section>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', sheet: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', strong: '#3A3A38', scrim: 'rgba(0,0,0,0.6)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', surface: '#FFFFFF', sheet: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', strong: '#C0BEB8', scrim: 'rgba(0,0,0,0.35)', photo: '#EFEDE8' };
return { t };
}
}
</script>
</body>
</html>
