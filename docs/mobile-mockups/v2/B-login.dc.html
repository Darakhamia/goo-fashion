<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Вход</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">
<div style="height: 60px; display: flex; align-items: center; gap: 4px; padding: 8px 12px 0; box-sizing: border-box">
<button aria-label="Back" style="width: 44px; height: 44px; border-radius: 50%; border: 1px solid {{t.border}}; background: {{t.surface}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg></button>
<span style="flex: 1; text-align: center; margin-right: 48px; font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.16em">GOO</span>
</div>

<div style="padding: 36px 20px 0">
<h1 style="margin: 0; font-size: 26px; line-height: 1.2; font-weight: 600; letter-spacing: -0.015em">Sign in to GOO-Fashion</h1>
<button style="margin-top: 24px; width: 100%; height: 50px; border: 0; border-radius: 25px; background: {{t.surface}}; box-shadow: inset 0 0 0 1px {{t.border}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; gap: 10px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M21.6 12.2c0-.7-.1-1.4-.2-2H12v3.8h5.4a4.6 4.6 0 0 1-2 3v2.5h3.2c1.9-1.7 3-4.3 3-7.3Z" fill="#4285F4"></path><path d="M12 22c2.7 0 5-.9 6.6-2.4l-3.2-2.5c-.9.6-2 1-3.4 1-2.6 0-4.8-1.8-5.6-4.1H3.1v2.6A10 10 0 0 0 12 22Z" fill="#34A853"></path><path d="M6.4 14c-.2-.6-.3-1.3-.3-2s.1-1.4.3-2V7.4H3.1a10 10 0 0 0 0 9.2L6.4 14Z" fill="#FBBC05"></path><path d="M12 5.9c1.5 0 2.8.5 3.8 1.5l2.9-2.9A10 10 0 0 0 3.1 7.4L6.4 10c.8-2.3 3-4.1 5.6-4.1Z" fill="#EA4335"></path></svg>
Continue with Google
</button>
<div style="margin: 18px 0; display: flex; align-items: center; gap: 12px; font-size: 13px; color: {{t.muted}}"><span style="flex: 1; height: 1px; background: {{t.border}}"></span>or<span style="flex: 1; height: 1px; background: {{t.border}}"></span></div>
<label style="display: block; font-size: 13px; color: {{t.muted}}">Email address
<input type="email" value="" placeholder="you@example.com" style="display: block; margin-top: 8px; width: 100%; box-sizing: border-box; height: 50px; border: 1px solid {{t.strong}}; border-radius: 14px; background: transparent; color: {{t.fg}}; padding: 0 14px; font-family: inherit; font-size: 16px; outline: none">
</label>
<button style="margin-top: 14px; width: 100%; height: 50px; border: 0; border-radius: 25px; background: {{t.fg}}; color: {{t.bg}}; font-family: inherit; font-size: 16px; font-weight: 600; cursor: pointer">Continue</button>
<p style="margin: 16px 0 0; text-align: center; font-size: 14px; color: {{t.muted}}">Don't have an account? <a href="#" style="color: {{t.fg}}; text-underline-offset: 3px">Sign up</a></p>
</div>

<div style="position: absolute; left: 20px; right: 20px; bottom: 34px">
<div style="display: flex; flex-direction: column; gap: 12px">
<sc-for list="{{perks}}" as="p" hint-placeholder-count="3">
<div style="display: flex; gap: 12px"><span style="width: 6px; height: 6px; margin-top: 7px; flex: none; border-radius: 50%; background: {{t.muted}}"></span><span><span style="display: block; font-size: 14px; font-weight: 500">{{p.title}}</span><span style="display: block; margin-top: 1px; font-size: 13px; line-height: 1.4; color: {{t.muted}}">{{p.body}}</span></span></div>
</sc-for>
</div>
<p style="margin: 18px 0 0; text-align: center; font-size: 12px; color: {{t.muted}}">Secured by Clerk</p>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', strong: '#3A3A38' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', strong: '#C0BEB8' };
const perks = [
{ title: 'Generate outfits instantly', body: 'Describe a vibe — the AI composes a full look and renders it.' },
{ title: 'Build it by hand', body: 'Drag pieces from 50+ brands into a single look in the builder.' },
{ title: 'See it before you buy', body: 'Every outfit rendered on a mannequin or as a flat-lay, not imagined.' }
];
return { t, perks };
}
}
</script>
</body>
</html>
