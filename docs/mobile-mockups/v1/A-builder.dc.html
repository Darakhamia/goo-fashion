<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>А · Конструктор</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="height: 52px; display: flex; align-items: center; padding: 0 6px; box-sizing: border-box">
<button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<h1 style="flex: 1; margin: 0; font-size: 16px; font-weight: 600">New look</h1>
<button aria-label="Ask AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">AI</button>
<button style="height: 44px; padding: 0 14px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 15px; font-weight: 600; cursor: pointer">Save</button>
</header>

<div style="position: relative; height: 340px; background: {{t.photo}}">
<svg viewBox="0 0 120 160" aria-label="Jil Sander Structured Blazer" style="position: absolute; left: 30px; top: 26px; width: 170px; height: auto"><path d="M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z" fill="#3E4A57"></path><path d="M60 30 L60 132 M44 20 L53 60 L60 30 M76 20 L67 60 L60 30" fill="none" stroke="rgba(0,0,0,0.25)" stroke-width="1" stroke-linecap="round"></path></svg>
<svg viewBox="0 0 120 160" aria-label="Lemaire Wide-Leg Trousers" style="position: absolute; left: 218px; top: 20px; width: 118px; height: auto"><path d="M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z" fill="#8C877C"></path><path d="M36 24 L84 24 M60 24 L60 56" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" stroke-linecap="round"></path></svg>
<svg viewBox="0 0 120 160" aria-label="Acne Studios Chelsea Boots" style="position: absolute; left: 230px; top: 188px; width: 110px; height: auto"><path d="M28 56 L52 56 L52 116 Q66 118 74 126 Q78 138 72 142 L24 142 L24 118 Z M64 46 L88 46 L88 106 Q102 108 110 116 Q114 128 108 132 L60 132 L60 108 Z" fill="#2B2926"></path></svg>
</div>

<div style="height: 48px; padding: 0 8px 0 20px; display: flex; align-items: center; justify-content: space-between; border-bottom: 1px solid {{t.border}}">
<div style="font-size: 15px"><span style="font-weight: 600">$2,060</span><span style="color: {{t.muted}}; font-size: 14px"> · 3 pieces</span></div>
<button style="height: 44px; padding: 0 12px; border: 0; background: transparent; color: {{t.muted}}; font-family: inherit; font-size: 14px; cursor: pointer">Clear all</button>
</div>

<div style="height: 44px; display: flex; align-items: stretch; padding-left: 8px; border-bottom: 1px solid {{t.border}}">
<button aria-label="Filters" style="width: 44px; flex: none; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"><path d="M4 7h16M7 12h10M10 17h4"></path></svg>
</button>
<div style="display: flex; gap: 20px; padding-left: 6px; white-space: nowrap; overflow: hidden">
<sc-for list="{{cats}}" as="c" hint-placeholder-count="5">
<button aria-pressed="{{c.on}}" style="border: 0; background: transparent; padding: 0; font-family: inherit; font-size: 14px; font-weight: 500; color: {{c.color}}; box-shadow: {{c.line}}; cursor: pointer">{{c.label}}</button>
</sc-for>
</div>
</div>

<div style="padding: 14px 0 0 20px; display: flex; gap: 10px; overflow: hidden">
<sc-for list="{{items}}" as="p" hint-placeholder-count="4">
<button aria-label="{{p.aria}}" style="width: 118px; flex: none; border: 0; padding: 0; background: transparent; color: {{t.fg}}; text-align: left; font-family: inherit; cursor: pointer">
<span style="position: relative; display: flex; align-items: center; justify-content: center; height: 150px; border-radius: 8px; background: {{t.photo}}; box-shadow: {{p.ring}}">
<svg viewBox="0 0 120 160" style="width: 66px; height: auto"><path d="{{p.d}}" fill="{{p.c}}"></path></svg>
<sc-if value="{{p.added}}" hint-placeholder-val="{{false}}">
<span style="position: absolute; top: 8px; left: 8px; width: 22px; height: 22px; border-radius: 50%; background: #0A0A0A; display: flex; align-items: center; justify-content: center"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="#F0EEE8" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12l5 5 9-10"></path></svg></span>
</sc-if>
</span>
<span style="display: block; margin-top: 8px; font-size: 12px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{p.brand}}</span>
<span style="display: block; font-size: 12px; color: {{t.muted}}">{{p.price}}</span>
</button>
</sc-for>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding-bottom: 20px; box-sizing: border-box; background: {{t.overlay}}; border-top: 1px solid {{t.border}}; display: flex; backdrop-filter: blur(12px)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span style="font-size: 10px; line-height: 1; font-weight: {{n.fw}}">{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89', border: '#222220', overlay: 'rgba(10,10,10,0.92)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E4E1DA', overlay: 'rgba(244,242,238,0.92)', photo: '#E9E6E0' };
const cats = ['All', 'Tops', 'Bottoms', 'Shoes', 'Accessories'].map((label) => ({
label, on: label === 'All', color: label === 'All' ? t.fg : t.muted, line: label === 'All' ? 'inset 0 -1.5px 0 ' + t.fg : 'none'
}));
const items = [
{ brand: 'Jil Sander', price: '$1,100', c: '#3E4A57', added: true, d: 'M44 20 L60 30 L76 20 L94 30 L104 98 L93 100 L86 64 L88 132 L32 132 L34 64 L27 100 L16 98 L26 30 Z' },
{ brand: 'Cos', price: '$95', c: '#F4F1EA', added: false, d: 'M47 20 L60 30 L73 20 L95 30 L106 92 L95 96 L88 60 L88 134 L32 134 L32 60 L25 96 L14 92 L25 30 Z' },
{ brand: 'Massimo Dutti', price: '$139', c: '#5A5550', added: false, d: 'M36 14 L84 14 L91 150 L67 150 L60 56 L53 150 L29 150 Z' },
{ brand: 'Maison Margiela', price: '$1,480', c: '#C9B8A6', added: false, d: 'M48 14 L52 14 L55 42 L65 42 L68 14 L72 14 L74 46 L88 150 L32 150 L46 46 Z' }
].map((p) => ({ ...p, aria: (p.added ? 'Remove ' : 'Add ') + p.brand, ring: p.added ? 'inset 0 0 0 1.5px #0A0A0A' : 'none' }));
const icons = [
['Browse', 'M17.5 11a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0 M16 16l4 4'],
['Builder', 'M7 4L3 8v2.5L5.5 9V20h13V9l2.5 1.5V8l-4-4S15.5 6 12 6 7 4 7 4Z'],
['Journal', 'M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5v-14Z M5 19.5A2.5 2.5 0 0 1 7.5 17H19v4H7.5A2.5 2.5 0 0 1 5 19.5Z M9 7.5h6M9 10.5h4'],
['My likes', 'M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z'],
['Profile', 'M16 8a4 4 0 1 1-8 0a4 4 0 1 1 8 0 M4.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5']
];
const nav = icons.map(([label, d]) => ({ label, d, color: label === 'Builder' ? t.fg : t.muted, sw: label === 'Builder' ? 1.7 : 1.3, fw: label === 'Builder' ? 600 : 400 }));
return { t, cats, items, nav };
}
}
</script>
</body>
</html>
