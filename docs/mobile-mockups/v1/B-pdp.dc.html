<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Б · Товар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="margin: 8px 12px 0; height: 52px; border-radius: 26px; border: 1px solid {{t.border}}; background: {{t.surface}}; display: flex; align-items: center; justify-content: space-between; padding: 0 4px; box-sizing: border-box">
<button aria-label="Back" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
</button>
<a href="#" style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 17px; letter-spacing: 0.16em; color: {{t.fg}}; text-decoration: none">GOO</a>
<div style="display: flex; align-items: center">
<button aria-label="Open AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 13px; font-weight: 600; cursor: pointer">AI</button>
<button aria-label="Open bag, 2 items" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="21" height="21" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="position: absolute; top: 8px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.fg}}; color: {{t.bg}}; font-size: 9px; font-weight: 700; line-height: 15px; text-align: center">2</span>
</button>
</div>
</header>

<div style="margin: 12px 12px 0; position: relative; height: 456px; border-radius: 20px; overflow: hidden; background: {{t.photo}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 120 160" style="width: 220px; height: auto"><path d="M44 16 L60 28 L76 16 L95 27 L106 98 L94 101 L86 60 L88 150 L32 150 L34 60 L26 101 L14 98 L25 27 Z" fill="#B39373"></path><path d="M60 28 L60 150 M44 16 L52 54 L60 28 M76 16 L68 54 L60 28 M40 104 L50 104 M70 104 L80 104" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" stroke-linecap="round"></path></svg>
<span style="position: absolute; top: 14px; left: 14px; font-size: 11px; font-weight: 600; color: #0A0A0A; background: rgba(255,255,255,0.82); border-radius: 999px; padding: 4px 9px">New</span>
<button aria-label="Like" style="position: absolute; top: 4px; right: 4px; width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.78); display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"></path></svg>
</span>
</button>
<span style="position: absolute; bottom: 12px; right: 12px; font-size: 11px; font-weight: 500; color: #0A0A0A; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 4px 9px">1 / 2</span>
</div>

<div style="padding: 16px 16px 0">
<div style="font-size: 13px; font-weight: 600; color: {{t.muted}}">Toteme</div>
<h1 style="margin: 2px 0 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Oversized Wool Coat</h1>
<div style="margin-top: 14px; display: flex; align-items: center; gap: 4px">
<sc-for list="{{colours}}" as="c" hint-placeholder-count="3">
<button aria-label="{{c.label}}" aria-pressed="{{c.on}}" style="width: 44px; height: 44px; border: 0; padding: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 28px; height: 28px; border-radius: 50%; background: {{c.hex}}; box-shadow: {{c.ring}}"></span>
</button>
</sc-for>
<span style="margin-left: 6px; font-size: 14px; color: {{t.muted}}">Camel</span>
</div>
</div>

<div style="position: absolute; left: 12px; right: 12px; bottom: 20px; height: 64px; border-radius: 22px; background: {{t.overlay}}; border: 1px solid {{t.border}}; display: flex; align-items: center; gap: 8px; padding: 0 10px 0 18px; box-sizing: border-box; backdrop-filter: blur(14px)">
<div style="flex: 1">
<div style="font-size: 15px; font-weight: 600">From $890</div>
<div style="font-size: 12px; color: {{t.muted}}">3 stores</div>
</div>
<button aria-label="Add to bag" style="width: 44px; height: 44px; border: 0; border-radius: 50%; background: {{t.soft}}; color: {{t.fg}}; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="19" height="19" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path><path d="M12 11v5M9.5 13.5h5"></path></svg>
</button>
<a href="#" style="height: 44px; padding: 0 18px; border-radius: 22px; background: {{t.fg}}; color: {{t.bg}}; display: flex; align-items: center; font-size: 15px; font-weight: 600; text-decoration: none">Where to buy</a>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', surface: '#151515', fg: '#F0EEE8', muted: '#8E8E89', border: '#232321', overlay: 'rgba(22,22,21,0.92)', soft: 'rgba(240,238,232,0.09)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', surface: '#FFFFFF', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E8E6E0', overlay: 'rgba(255,255,255,0.92)', soft: 'rgba(10,10,10,0.06)', photo: '#EFEDE8' };
const colours = [['Camel', '#B39373', true], ['Charcoal', '#3B3A38', false], ['Ecru', '#E8E1D2', false]].map(([label, hex, on]) => ({
label, hex, on, ring: on ? '0 0 0 2px ' + t.bg + ', 0 0 0 3.5px ' + t.fg : '0 0 0 1px ' + t.border
}));
return { t, colours };
}
}
</script>
</body>
</html>
