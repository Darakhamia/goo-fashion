<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>А · Товар</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;600;700&amp;family=Poppins:wght@800&amp;display=swap">
<style>
body{margin:0}
</style>
</helmet>
<div style="width: 390px; height: 844px; position: relative; overflow: hidden; background: {{t.bg}}; color: {{t.fg}}; font-family: 'Inter Tight', system-ui, sans-serif; -webkit-font-smoothing: antialiased">

<header style="height: 52px; display: flex; align-items: center; justify-content: space-between; padding: 0 6px 0 20px; box-sizing: border-box">
<a href="#" style="font-family: Poppins, sans-serif; font-weight: 800; font-size: 19px; letter-spacing: 0.16em; color: {{t.fg}}; text-decoration: none">GOO</a>
<div style="display: flex; align-items: center">
<button aria-label="Open AI Stylist" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; font-family: inherit; font-size: 14px; font-weight: 600; cursor: pointer">AI</button>
<button aria-label="Open bag, 2 items" style="width: 44px; height: 44px; border: 0; background: transparent; color: {{t.fg}}; position: relative; display: flex; align-items: center; justify-content: center; cursor: pointer">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
<span style="position: absolute; top: 8px; right: 7px; min-width: 15px; height: 15px; padding: 0 4px; box-sizing: border-box; border-radius: 8px; background: {{t.fg}}; color: {{t.bg}}; font-size: 9px; font-weight: 700; line-height: 15px; text-align: center">2</span>
</button>
</div>
</header>

<nav aria-label="Breadcrumb" style="height: 28px; padding: 0 20px; display: flex; align-items: center; gap: 6px; font-size: 12px; color: {{t.muted}}">
<a href="#" style="color: {{t.muted}}; text-decoration: none">Browse</a><span>/</span><a href="#" style="color: {{t.muted}}; text-decoration: none">Outerwear</a><span>/</span><span style="color: {{t.fg}}">Toteme</span>
</nav>

<div style="position: relative; height: 490px; background: {{t.photo}}; display: flex; align-items: center; justify-content: center">
<svg viewBox="0 0 120 160" style="width: 230px; height: auto"><path d="M44 16 L60 28 L76 16 L95 27 L106 98 L94 101 L86 60 L88 150 L32 150 L34 60 L26 101 L14 98 L25 27 Z" fill="#B39373"></path><path d="M60 28 L60 150 M44 16 L52 54 L60 28 M76 16 L68 54 L60 28 M40 104 L50 104 M70 104 L80 104" fill="none" stroke="rgba(0,0,0,0.2)" stroke-width="1" stroke-linecap="round"></path></svg>
<span style="position: absolute; top: 14px; left: 16px; font-size: 11px; font-weight: 500; color: #0A0A0A; background: rgba(255,255,255,0.8); border-radius: 999px; padding: 4px 9px">New</span>
<button aria-label="Like" style="position: absolute; top: 4px; right: 4px; width: 48px; height: 48px; border: 0; background: transparent; display: flex; align-items: center; justify-content: center; cursor: pointer">
<span style="width: 34px; height: 34px; border-radius: 50%; background: rgba(255,255,255,0.78); display: flex; align-items: center; justify-content: center">
<svg width="17" height="17" viewBox="0 0 24 24" fill="none" stroke="#0A0A0A" stroke-width="1.7" stroke-linejoin="round"><path d="M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z"></path></svg>
</span>
</button>
<div aria-label="Photo 1 of 2" style="position: absolute; bottom: 14px; left: 0; right: 0; display: flex; justify-content: center; gap: 6px">
<span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(10,10,10,0.75)"></span>
<span style="width: 6px; height: 6px; border-radius: 50%; background: rgba(10,10,10,0.22)"></span>
</div>
</div>

<div style="padding: 14px 20px 0">
<div style="font-size: 13px; font-weight: 600">Toteme</div>
<h1 style="margin: 2px 0 0; font-size: 22px; line-height: 1.2; font-weight: 600; letter-spacing: -0.01em">Oversized Wool Coat</h1>
<div style="margin-top: 6px; font-size: 16px"><span style="font-weight: 600">From $890</span><span style="color: {{t.muted}}; font-size: 14px"> · 3 stores · price varies by store</span></div>
</div>

<div style="position: absolute; left: 20px; right: 20px; top: 704px; display: flex; gap: 10px">
<button style="height: 48px; padding: 0 16px; border-radius: 12px; border: 1px solid {{t.strong}}; background: transparent; color: {{t.fg}}; display: flex; align-items: center; gap: 8px; font-family: inherit; font-size: 15px; font-weight: 500; cursor: pointer">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"><path d="M6 8h12l-1 12H7L6 8Z"></path><path d="M9 8V6.5a3 3 0 0 1 6 0V8"></path></svg>
Add to bag
</button>
<a href="#" style="flex: 1; height: 48px; border-radius: 12px; background: {{t.fg}}; color: {{t.bg}}; display: flex; align-items: center; justify-content: center; gap: 8px; font-size: 15px; font-weight: 600; text-decoration: none">
Buy at MyTheresa
<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M8 16L16 8M9 8h7v7"></path></svg>
</a>
</div>

<nav aria-label="Main" style="position: absolute; left: 0; right: 0; bottom: 0; height: 76px; padding-bottom: 20px; box-sizing: border-box; background: {{t.overlay}}; border-top: 1px solid {{t.border}}; display: flex; backdrop-filter: blur(12px)">
<sc-for list="{{nav}}" as="n" hint-placeholder-count="5">
<a href="#" style="flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 4px; text-decoration: none; color: {{n.color}}">
<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="{{n.sw}}" stroke-linecap="round" stroke-linejoin="round"><path d="{{n.d}}"></path></svg>
<span style="font-size: 10px; line-height: 1; font-weight: {{n.fw}}">{{n.label}}</span>
</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"dark":{"editor":"boolean","default":true},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
renderVals() {
const dark = this.props.dark ?? true;
const t = dark
? { bg: '#0A0A0A', fg: '#F0EEE8', muted: '#8E8E89', border: '#222220', strong: '#3A3A38', overlay: 'rgba(10,10,10,0.92)', photo: '#EDEBE6' }
: { bg: '#F4F2EE', fg: '#0A0A0A', muted: '#6B6B6B', border: '#E4E1DA', strong: '#C0BEB8', overlay: 'rgba(244,242,238,0.92)', photo: '#E9E6E0' };
const icons = [
['Browse', 'M17.5 11a6.5 6.5 0 1 1-13 0a6.5 6.5 0 1 1 13 0 M16 16l4 4'],
['Builder', 'M7 4L3 8v2.5L5.5 9V20h13V9l2.5 1.5V8l-4-4S15.5 6 12 6 7 4 7 4Z'],
['Journal', 'M5 5.5A2.5 2.5 0 0 1 7.5 3H19v14H7.5A2.5 2.5 0 0 0 5 19.5v-14Z M5 19.5A2.5 2.5 0 0 1 7.5 17H19v4H7.5A2.5 2.5 0 0 1 5 19.5Z M9 7.5h6M9 10.5h4'],
['My likes', 'M12 20s-7.5-4.6-7.5-10.2A4.3 4.3 0 0 1 12 7.3a4.3 4.3 0 0 1 7.5 2.5C19.5 15.4 12 20 12 20Z'],
['Profile', 'M16 8a4 4 0 1 1-8 0a4 4 0 1 1 8 0 M4.5 20.5c0-4.1 3.4-7.5 7.5-7.5s7.5 3.4 7.5 7.5']
];
const active = 'Browse';
const nav = icons.map(([label, d]) => ({ label, d, color: label === active ? t.fg : t.muted, sw: label === active ? 1.7 : 1.3, fw: label === active ? 600 : 400 }));
return { t, nav };
}
}
</script>
</body>
</html>
