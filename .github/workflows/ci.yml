name: CI

on:
  push:
    branches: [master]
  pull_request:

# Новый пуш в ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Линт пока не блокирует прогон: на master уже лежат 24 ошибки eslint
      # (react/no-unescaped-entities, react-hooks/set-state-in-effect,
      # prefer-const, react-hooks/purity). Пока они не разобраны, блокирующий
      # линт делал бы CI красным на любом PR, включая непричастные.
      # Результат виден в логе и аннотациях. Убрать continue-on-error,
      # когда счётчик дойдёт до нуля.
      - name: Lint
        continue-on-error: true
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
