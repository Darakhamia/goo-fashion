name: CI

on:
  push:
    branches: [master]
  pull_request:

# Новый пуш в ветку отменяет предыдущий незавершённый прогон.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  checks:
    name: lint / typecheck / build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version-file: .node-version
          cache: npm

      - name: Install dependencies
        run: npm ci

      # Линт блокирует прогон: ошибок eslint на master ноль (код-ревью
      # 2026-09). Предупреждения прогон не валят, но видны в логе.
      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npx tsc --noEmit

      - name: Build
        run: npm run build
